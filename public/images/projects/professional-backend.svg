<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img"
     aria-label="A forward migration rewrites each row; a ledger records what each row held, so the migration can be replayed backwards.">
  <style>
    svg { --paper:#f5f6f6; --ink:#15181a; --muted:#6a7275; --rule:#e0e4e4; --sunk:#eef0f0; }
    @media (prefers-color-scheme: dark) {
      svg { --paper:#0f1213; --ink:#ecefef; --muted:#828b8d; --rule:#262c2d; --sunk:#1b2021; }
    }
    .bg{fill:var(--paper)} .sunk{fill:var(--sunk)} .ink{fill:var(--ink)} .mut{fill:var(--muted)}
    .rule{stroke:var(--rule)} .line{stroke:var(--muted);fill:none}
    .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
  </style>

  <rect class="bg" width="1280" height="800"/>

  <text class="mono mut" x="80" y="118" font-size="44" letter-spacing="3">REVERSE-MIGRATION LEDGER</text>

  <!-- les deux états d'une ligne -->
  <rect class="sunk rule" x="80"  y="210" width="420" height="150" rx="12" stroke-width="2"/>
  <text class="mono ink" x="290" y="305" font-size="62" text-anchor="middle">before</text>

  <rect class="sunk rule" x="780" y="210" width="420" height="150" rx="12" stroke-width="2"/>
  <text class="mono ink" x="990" y="305" font-size="62" text-anchor="middle">after</text>

  <!-- aller : destructif côté ligne -->
  <path class="line" d="M 500 285 H 760" stroke-width="5"/>
  <path d="M 764 285 l -24 -15 v 30 z" fill="var(--muted)"/>
  <text class="sans mut" x="630" y="252" font-size="44" text-anchor="middle">migrate</text>

  <!-- retour : le rejeu, rendu possible par le ledger -->
  <path class="line" d="M 990 400 V 520 H 290 V 400" stroke-width="5"/>
  <path d="M 290 396 l -15 24 h 30 z" fill="var(--muted)"/>
  <text class="sans ink" x="640" y="580" font-size="46" text-anchor="middle">replay backwards</text>

  <line class="rule" x1="80" y1="650" x2="1200" y2="650" stroke-width="1"/>
  <text class="sans mut" x="80" y="716" font-size="48">the undo, specified before the migration ran</text>
</svg>
