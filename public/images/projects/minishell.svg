<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img"
     aria-label="A minishell session: echo with double quotes prints hello world, echo with single quotes prints hello dollar NAME unchanged.">
  <style>
    svg {
      --paper: #f5f6f6;
      --ink: #15181a;
      --muted: #6a7275;
      --rule: #e0e4e4;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #0f1213;
        --ink: #ecefef;
        --muted: #828b8d;
        --rule: #262c2d;
      }
    }
    .bg   { fill: var(--paper); }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif; }
    .ink  { fill: var(--ink); }
    .mut  { fill: var(--muted); }
    .rule { stroke: var(--rule); }
  </style>

  <rect class="bg" width="1280" height="800"/>

  <!--
    Transcript copied from a real run of the compiled binary (x86-64 Linux
    container), not typed out here. The live prompt is cyan; rendered greyscale
    because teal means "runnable" on this site and this is a still image.
    One idea only: double quotes expand, single quotes do not.
  -->
  <text class="mono mut" x="80" y="128" font-size="46" letter-spacing="3">PARAMETER EXPANSION</text>

  <g class="mono" font-size="56">
    <text x="80" y="300"><tspan class="mut">minishell&gt; </tspan><tspan class="ink">echo "hello $NAME"</tspan></text>
    <text class="ink" x="80" y="386">hello world</text>

    <text x="80" y="516"><tspan class="mut">minishell&gt; </tspan><tspan class="ink">echo 'hello $NAME'</tspan></text>
    <text class="ink" x="80" y="602">hello $NAME</text>
  </g>

  <line class="rule" x1="80" y1="676" x2="1200" y2="676" stroke-width="1"/>
  <text class="sans mut" x="80" y="736" font-size="52">one quote changes everything</text>
</svg>
